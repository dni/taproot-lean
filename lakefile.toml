name = "TaprootLean"
version = "0.1.0"
keywords = ["bitcoin", "cryptography", "taproot"]
defaultTargets = ["Taproot"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false # no Mathlib-style copyright header needed
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "Taproot"
